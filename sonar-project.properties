# SonarQube / SonarCloud configuration — Round 52e
#
# Run locally:  sonar-scanner   (after `pytest --cov` and `yarn test --coverage`)
# Run in CI:    via .github/workflows/quality.yml
#
# Why one Sonar project, not two?
#   Easier ownership / single quality gate covers the whole user-facing
#   experience. Module separation lets us still slice metrics per
#   surface (frontend vs backend) in the dashboard.

sonar.projectKey=mintu-finance
sonar.projectName=MintU
sonar.projectVersion=1.0
# SonarCloud requires this; SonarQube self-hosted ignores it.
# Override at scan time via -Dsonar.organization=... if your org slug differs.
sonar.organization=mintu

# ── Modules ──────────────────────────────────────────────────────────
sonar.modules=backend,frontend

# ── Backend module (Python / FastAPI) ────────────────────────────────
backend.sonar.projectName=MintU Backend
backend.sonar.sources=.
backend.sonar.exclusions=tests/**,**/__pycache__/**,**/venv/**,**/*.pyc
backend.sonar.tests=tests
backend.sonar.test.inclusions=tests/**/*.py
backend.sonar.python.version=3.11
backend.sonar.python.coverage.reportPaths=coverage.xml

# ── Frontend module (TypeScript / React Native) ─────────────────────
frontend.sonar.projectName=MintU Frontend
frontend.sonar.sources=.
frontend.sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.test.ts,**/*.test.tsx,jest.setup.js,assets/**,scripts/**
frontend.sonar.tests=__tests__
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ── Source encoding ──────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Quality gate ── Sonar reads gate from server config; locally we
# tag a soft target so devs see the same dashboard expectations.
# Soft start: 30 % coverage; ratchet quarterly to 50 → 70 → 90.
sonar.qualitygate.wait=true
