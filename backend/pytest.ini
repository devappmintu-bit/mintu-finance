[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py *_test.py
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv tests/_archive
addopts =
    --strict-markers
    --tb=short
    -ra
    --ignore=tests/_archive
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: integration tests against a live MongoDB
    unit: pure-python unit tests (no I/O)

# Coverage config — feeds into Sonar via coverage.xml
[coverage:run]
source = .
branch = True
omit =
    tests/*
    __pycache__/*
    venv/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    @abstractmethod
show_missing = True
skip_covered = False

[coverage:xml]
output = coverage.xml
