name: Quality (tests + coverage + Sonar)
# Round 52e — Enterprise quality gate.
#
# Runs on every push / PR:
#   1. Backend pytest with coverage → coverage.xml
#   2. Frontend jest with coverage  → coverage/lcov.info
#   3. SonarCloud scan that ingests both coverage reports
#
# Quality gate is enforced on the SonarCloud server side. We start with
# a SOFT gate (coverage ≥ 30 %) and ratchet quarterly:
#   Q1 → 30 %   (this round, MVP-honest)
#   Q2 → 50 %
#   Q3 → 70 %
#   Q4 → 90 %   (target enterprise floor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest --cov
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage (unit only — fast subset)
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: mintu_database_ci
          JWT_SECRET: ci-test-secret-do-not-use
        run: |
          pytest tests/test_round52e_cache.py tests/test_round52e_ws_manager.py \
            --cov=core \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            -v

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend · jest --coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run jest with coverage
        working-directory: frontend
        run: yarn test:coverage

      - name: Upload frontend coverage (lcov + json-summary)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json

  coverage-floor:
    name: Per-module coverage floor (critical-path gate)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Enforce per-module floors
        env:
          BACKEND_COVERAGE_XML: backend/coverage.xml
          FRONTEND_COVERAGE_JSON: frontend/coverage/coverage-summary.json
        run: bash scripts/check-coverage-floor.sh

  diff-coverage:
    # Round 53b — Diff coverage gate. Enforces ≥ 80% coverage on lines
    # CHANGED in this PR. Complements coverage-floor.sh:
    #   • coverage-floor → protects existing critical-path modules
    #   • diff-coverage  → forces every NEW line to be tested
    # Together they make the codebase self-improving: legacy untouched
    # code can't drag the build down, but no PR can land untested logic.
    name: Diff coverage (PR-only gate, ≥80% on changed lines)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover walks `git diff` against the base ref, so we need
          # full history (not the default shallow clone).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diff-cover
        run: pip install --quiet 'diff-cover==10.2.0'

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Enforce diff coverage ≥ 80%
        env:
          DIFF_COVERAGE_FLOOR: '80'
          BACKEND_COVERAGE_XML: backend/coverage.xml
          FRONTEND_LCOV: frontend/coverage/lcov.info
        run: |
          # Make sure the base ref is reachable for the diff comparison.
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"
          bash scripts/diff-coverage.sh "$BASE"

      - name: Upload diff-coverage HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage-reports
          path: diff-coverage-report/
          if-no-files-found: ignore

  sonar:
    # Round 53j — SonarCloud scan + quality-gate enforcement.
    #
    # Behaviour:
    #   • SONAR_TOKEN secret unset → job is a NO-OP (logs why, exit 0).
    #     Lets forks / first-run repos build green without manual setup.
    #   • SONAR_TOKEN set → real scan runs; ``sonar.qualitygate.wait=true``
    #     in sonar-project.properties causes the action to FAIL the
    #     workflow if the SonarCloud-side quality gate fails.
    #   • Fork PRs (head.repo != base.repo) skip — secrets aren't
    #     available there. Sonar runs on the merge-back push instead.
    name: SonarCloud scan + quality gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for blame-based new-code metrics

      - name: Detect SONAR_TOKEN presence
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✓ SONAR_TOKEN is configured — scan will run."
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠  SONAR_TOKEN is NOT configured."
            echo "    Set it in repo Settings → Secrets → Actions to enable the scan."
            echo "    See docs/SONAR_INTEGRATION.md for the one-time setup runbook."
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: backend-coverage
          path: backend

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        if: steps.gate.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          # Provided by SonarCloud — set in repo Settings → Secrets.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
